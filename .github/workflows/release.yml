# Builds, tests and packages the Windows binary and installer, and publishes releases.
#   - Every run (pull requests, pushes to main, manual runs): the zip, setup.exe and checksums
#     are attached to the run as an artifact.
#   - Releases are automatic: a push to main that changes the app is released as a new version
#     (scripts/release-plan.ps1 decides what counts and picks the number). The run builds that
#     version, commits it to main (Cargo.toml, Cargo.lock and the dated CHANGELOG.md section),
#     tags that commit and publishes the GitHub release. Pushes that only change docs, the
#     workflow or scripts are built but not released.
name: Build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Inno Setup builds the installer. Pinned, and checked against this SHA-256.
  INNO_VERSION: 6.7.4
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history and tags, to compare with the last release

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        run: |
          # On main, a push that changes the app becomes a release: the script sets the new
          # version in Cargo.toml and Cargo.lock and dates the CHANGELOG.md notes, so
          # everything below builds that version.
          $main = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          $plan = ./scripts/release-plan.ps1 -Apply:$main | Select-Object -Last 1
          $release = $main -and $plan.Changed
          $version = if ($release) { $plan.Next } else { $plan.Current }
          $label = if ($release) { "v$version" } else { "v$version-dev.$($env:GITHUB_SHA.Substring(0, 7))" }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $summary = if ($plan.Changed) { "Merging this pull request will release **v$($plan.Next)**." } else { "Merging this pull request won't publish a release: it doesn't change the app." }
            $summary >> $env:GITHUB_STEP_SUMMARY
          }
          "Version $version, label $label, release: $release"
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-$env:INNO_VERSION.exe"
          $tag = "is-" + $env:INNO_VERSION.Replace('.', '_')
          # Download through the API with the job's token: GitHub throttles anonymous release
          # downloads at busy times (504s). Retry a few times for other hiccups.
          for ($attempt = 1; ; $attempt++) {
            gh release download $tag --repo jrsoftware/issrc --pattern "innosetup-$env:INNO_VERSION.exe" --dir $env:RUNNER_TEMP --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path $setup)) { break }
            if ($attempt -ge 5) { throw "Could not download Inno Setup $env:INNO_VERSION" }
            Write-Warning "Download attempt $attempt failed; retrying"
            Start-Sleep -Seconds (15 * $attempt)
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download has SHA-256 $hash, expected $env:INNO_SHA256" }
          # Portable mode: unpacks the compiler without installing it.
          $dir = "$env:RUNNER_TEMP\inno"
          $p = Start-Process $setup -ArgumentList '/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=""', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not unpack (exit $($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Package
        id: package
        run: |
          $name = "rust-dirstat-${{ steps.version.outputs.label }}-windows-x64"
          # Portable zip.
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/rust-dirstat.exe, README.md, CHANGELOG.md, LICENSE dist/$name
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          Remove-Item -Recurse dist/$name
          # Installer.
          & $env:ISCC /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputName=$name-setup" installer/rust-dirstat.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # Checksums.
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Test the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist/${{ steps.package.outputs.name }}-setup.exe"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\rust-dirstat'
          $exe = Join-Path $dir 'rust-dirstat.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'rust-dirstat.lnk'
          function Install($installer) {
            $p = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=addtopath' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$installer exited with $($p.ExitCode)" }
          }
          function PathEntries { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir }).Count }

          # Upgrade test: install the latest published release first, if there is one.
          $previous = "$env:RUNNER_TEMP\previous-release"
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir $previous --clobber
          $old = Get-ChildItem $previous -Filter '*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($old) { "Installing the previous release: $($old.Name)"; Install $old.FullName } else { "No previous release to upgrade from." }

          Install $setup
          $out = & $exe --version
          if ($out -ne "rust-dirstat ${{ steps.version.outputs.version }}") { throw "unexpected --version output: $out" }
          if (Test-Path (Join-Path $dir 'dirstat.exe')) { throw "upgrade left the old dirstat.exe behind" }
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut at $shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ine $exe) { throw "Start menu shortcut points to $target" }
          if ((PathEntries) -ne 1) { throw "install folder is not on the user PATH once" }

          Install $setup  # reinstall over the top
          if ((PathEntries) -ne 1) { throw "reinstall changed the PATH entry count to $(PathEntries)" }
          if (Get-Process rust-dirstat -ErrorAction SilentlyContinue) { throw "a silent install started the app" }

          # The app's updater: a silent upgrade that keeps the previous options and starts the
          # app again (/relaunch=1).
          $p = Start-Process $setup -ArgumentList '/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/relaunch=1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the updater's install exited with $($p.ExitCode)" }
          if ((PathEntries) -ne 1) { throw "the updater's install changed the PATH entry count to $(PathEntries)" }
          $deadline = (Get-Date).AddSeconds(30)
          while (-not ($app = Get-Process rust-dirstat -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not $app) { throw "/relaunch=1 did not start the app again" }
          if (@($app)[0].Path -ine $exe) { throw "the app was started from $(@($app)[0].Path)" }
          $app | Stop-Process -Force
          Start-Sleep -Seconds 2

          # The uninstaller hands off to a copy of itself and returns early, so wait for it.
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu shortcut" }
          if ((PathEntries) -ne 0) { throw "uninstall left the PATH entry" }
          "Install, upgrade and uninstall all worked."
          exit 0  # the release download above may have set a non-zero exit code

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          retention-days: 14

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          # If something was merged while this run was building, leave the release to the run
          # for that newer commit: it includes these changes too.
          git fetch --quiet origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          if ((git rev-parse origin/main) -ne $env:GITHUB_SHA) {
            "::notice::main moved on while this run was building; the run for the newer commit releases these changes."
            exit 0
          }
          # Record the version on main, then tag that commit and publish the release.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Release $tag" -- Cargo.toml Cargo.lock CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git push --quiet origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          $commit = git rev-parse HEAD
          gh release create $tag (Get-ChildItem dist -File).FullName --target $commit `
            --title "rust-dirstat $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          "Published https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
