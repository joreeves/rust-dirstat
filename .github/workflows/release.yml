# Builds, tests and packages the Windows binary and installer.
#   - Pull requests and manual runs: the zip, setup.exe and checksums are attached to the run
#     as an artifact.
#   - Tags named vX.Y.Z: they are also published as a GitHub release, with the notes taken
#     from that version's section in CHANGELOG.md.
name: Build and release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Inno Setup builds the installer. Pinned, and checked against this SHA-256.
  INNO_VERSION: 6.7.4
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            }
            # Release notes: this version's section of CHANGELOG.md.
            $notes = @(); $found = $false
            foreach ($line in Get-Content CHANGELOG.md) {
              if ($line -match '^\[[^\]]+\]: ') { break }  # link definitions at the end
              if ($line -match '^## \[') {
                if ($found) { break }
                $found = $line -match "^## \[$([regex]::Escape($version))\]"
                continue
              }
              if ($found) { $notes += $line }
            }
            if (-not $found) { throw "CHANGELOG.md has no section for $version" }
            $notes -join "`n" | Set-Content release-notes.md -Encoding utf8
            $label = "v$version"
          } else {
            $label = "v$version-dev.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-$env:INNO_VERSION.exe"
          $tag = "is-" + $env:INNO_VERSION.Replace('.', '_')
          # Download through the API with the job's token: GitHub throttles anonymous release
          # downloads at busy times (504s). Retry a few times for other hiccups.
          for ($attempt = 1; ; $attempt++) {
            gh release download $tag --repo jrsoftware/issrc --pattern "innosetup-$env:INNO_VERSION.exe" --dir $env:RUNNER_TEMP --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path $setup)) { break }
            if ($attempt -ge 5) { throw "Could not download Inno Setup $env:INNO_VERSION" }
            Write-Warning "Download attempt $attempt failed; retrying"
            Start-Sleep -Seconds (15 * $attempt)
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download has SHA-256 $hash, expected $env:INNO_SHA256" }
          # Portable mode: unpacks the compiler without installing it.
          $dir = "$env:RUNNER_TEMP\inno"
          $p = Start-Process $setup -ArgumentList '/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=""', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not unpack (exit $($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Package
        id: package
        run: |
          $name = "rust-dirstat-${{ steps.version.outputs.label }}-windows-x64"
          # Portable zip.
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/dirstat.exe, README.md, CHANGELOG.md, LICENSE dist/$name
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          Remove-Item -Recurse dist/$name
          # Installer.
          & $env:ISCC /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputName=$name-setup" installer/rust-dirstat.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # Checksums.
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Test the installer
        run: |
          $setup = "dist/${{ steps.package.outputs.name }}-setup.exe"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\rust-dirstat'
          $exe = Join-Path $dir 'dirstat.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'rust-dirstat.lnk'
          function Install {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=addtopath' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          }
          function PathEntries { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -ieq $dir }).Count }

          Install
          $out = & $exe --version
          if ($out -ne "dirstat ${{ steps.version.outputs.version }}") { throw "unexpected --version output: $out" }
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut at $shortcut" }
          if ((PathEntries) -ne 1) { throw "install folder is not on the user PATH once" }

          Install  # upgrade in place
          if ((PathEntries) -ne 1) { throw "reinstall changed the PATH entry count to $(PathEntries)" }

          # The uninstaller hands off to a copy of itself and returns early, so wait for it.
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu shortcut" }
          if ((PathEntries) -ne 0) { throw "uninstall left the PATH entry" }
          "Install, upgrade and uninstall all worked."

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "rust-dirstat $env:GITHUB_REF_NAME"
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName `
            --verify-tag --title $title --notes-file release-notes.md
