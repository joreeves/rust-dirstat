[package]
name = "rust-dirstat"
version = "0.2.0"
edition = "2024"
description = "WinDirStat-style disk usage analyzer with a cushion treemap and a fast NTFS MFT scanner"
license = "MIT"

# The library keeps the short name, so code and tests use `dirstat::...`.
[lib]
name = "dirstat"
path = "src/lib.rs"

[[bin]]
name = "rust-dirstat"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
serde = "1.0"
serde_json = "1.0"
csv = "1.4"
trash = "5.3"
rfd = "0.18"
anyhow = "1.0"
# Update check: HTTPS to the GitHub API, trusting the OS certificate store.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
# README screenshots use the same system fonts (for icons) as the real window.
egui_system_font_provider = "0.37"
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
